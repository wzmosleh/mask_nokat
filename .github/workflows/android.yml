# Construit l'application Android (APK) à chaque mise à jour de main,
# puis la publie dans la page « Releases » du dépôt.
name: Application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        working-directory: android-app
        run: npm ci

      - name: Copie de l'application web dans le projet Android
        working-directory: android-app
        run: npm run sync

      - name: Construction de l'APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dictanote.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dictanote-apk
          path: dictanote.apk

      - name: Suppression de l'ancien fichier (mask-nokat.apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset android mask-nokat.apk --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publication dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Dictanote — تطبيق Android
          make_latest: true
          files: dictanote.apk
          body: |
            Dictanote: مسك النقط بالصوت (Saisie vocale des notes).
            حمّل الملف dictanote.apk على الهاتف، ثم افتحه للتثبيت.
            (يجب السماح بتثبيت التطبيقات من هذا المصدر عند أول تثبيت.)
