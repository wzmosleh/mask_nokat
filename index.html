<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسك النقط بالصوت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <img class="logo" src="assets/logo.png" alt="المملكة المغربية، وزارة التربية الوطنية والتعليم الأولي والتكوين المهني والتأهيل" onerror="this.remove()">
      <div class="titles">
        <strong id="appTitle" class="app-title">مسك النقط بالصوت</strong>
        <div class="top-info" id="topInfo"></div>
      </div>
      <span class="spacer"></span>
      <div class="top-actions">
        <button class="top-btn" id="homeBtn" type="button" data-act="home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
          <span id="homeLabel">الرئيسية</span>
        </button>
        <button class="top-btn" id="langBtn" type="button">Français</button>
      </div>
    </div>
  </header>
  <nav class="stepbar" id="stepbar" hidden></nav>

  <main id="app" aria-live="polite"></main>

  <footer class="foot"><span id="credit">تصميم وتطوير: الأستاذ رشيد مصلح</span></footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalCard"></div>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="i18n.js"></script>
  <script src="parser.js"></script>
  <script src="massar.js"></script>
  <script src="app.js"></script>
</body>
</html>
